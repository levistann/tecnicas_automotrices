<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Estado de Vehículos - Taller</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0f172a; /* Fondo oscuro de alto contraste */
      color: #f8fafc;
      padding: 30px;
      overflow: hidden; /* Evita barras de desplazamiento en TV */
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #334155;
      padding-bottom: 15px;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 2.5rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #38bdf8;
    }

    .clock {
      font-size: 2.2rem;
      font-weight: 700;
      color: #94a3b8;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      text-align: left;
      font-size: 1.6rem;
      color: #64748b;
      padding: 12px 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    td {
      padding: 18px 20px;
      font-size: 2rem;
      font-weight: 600;
      border-bottom: 1px solid #1e293b;
    }

    .col-modelo {
      width: 60%;
      color: #ffffff;
    }

    .col-estado {
      width: 40%;
    }

    /* Badges de estado con colores llamativos */
    .badge {
      display: inline-block;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 1.6rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .st-recibido { background-color: #3b82f6; color: #ffffff; }
    .st-diagnosticando { background-color: #eab308; color: #000000; }
    .st-repuestos { background-color: #f97316; color: #ffffff; }
    .st-proceso { background-color: #a855f7; color: #ffffff; }
    .st-listo { background-color: #22c55e; color: #ffffff; }
    .st-default { background-color: #475569; color: #ffffff; }
  </style>
</head>
<body>

  <header>
    <h1>Vehículos en Taller</h1>
    <div class="clock" id="reloj">--:--</div>
  </header>

  <table>
    <thead>
      <tr>
        <th class="col-modelo">Vehículo / Modelo</th>
        <th class="col-estado">Estado</th>
      </tr>
    </thead>
    <tbody id="tabla-cuerpo">
      <tr>
        <td colspan="2" style="text-align: center; color: #64748b;">Cargando datos...</td>
      </tr>
    </tbody>
  </table>

<script>
    // 1. PEGA AQUÍ EL ID EXTRAÍDO DE LA URL DE EDICIÓN DE TU HOJA
    const SHEET_ID = "1NAg-WiqwDBxwEo3wM0Uy3PquaBQGh-hNwWCBmBARvaw";
    const GID = "0"; // 0 corresponde a la primera pestaña

    function getBadgeClass(estado) {
      const e = (estado || "").toLowerCase().trim();
      if (e.includes("recibido")) return "st-recibido";
      if (e.includes("diagnost")) return "st-diagnosticando";
      if (e.includes("repuesto")) return "st-repuestos";
      if (e.includes("proceso")) return "st-proceso";
      if (e.includes("listo")) return "st-listo";
      return "st-default";
    }

    // Callback global invocado por la API de Google
    window.renderDatosGoogle = function(json) {
      const tbody = document.getElementById("tabla-cuerpo");
      try {
        if (!json || !json.table || !json.table.rows) {
          tbody.innerHTML = `<tr><td colspan="2" style="text-align:center; color:#64748b; padding-top:40px;">No se encontraron datos</td></tr>`;
          return;
        }

        const rows = json.table.rows;

        if (rows.length === 0) {
          tbody.innerHTML = `<tr><td colspan="2" style="text-align:center; color:#64748b; padding-top:40px;">No hay vehículos en lista</td></tr>`;
          return;
        }

        tbody.innerHTML = rows.map(r => {
          // Extrae el valor crudo o formateado de cada celda
          const modelo = (r.c[0] && r.c[0].v !== null) ? (r.c[0].f || r.c[0].v) : "—";
          const estado = (r.c[1] && r.c[1].v !== null) ? (r.c[1].f || r.c[1].v) : "Sin estado";
          const badgeClass = getBadgeClass(estado);

          return `
            <tr>
              <td class="col-modelo">${modelo}</td>
              <td class="col-estado">
                <span class="badge ${badgeClass}">${estado}</span>
              </td>
            </tr>
          `;
        }).join("");

      } catch (err) {
        console.error("Error al procesar los datos de Google:", err);
      }
    };

    function pedirDatos() {
      // Remover llamadas anteriores para no saturar memoria
      const scriptViejo = document.getElementById("gviz-script");
      if (scriptViejo) scriptViejo.remove();

      const script = document.createElement("script");
      script.id = "gviz-script";
      // Endpoint oficial de Google Visualization que soporta inyección por script y salta CORS
      script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:renderDatosGoogle&gid=${GID}&_nocache=${Date.now()}`;
      
      script.onerror = function() {
        const tbody = document.getElementById("tabla-cuerpo");
        tbody.innerHTML = `<tr><td colspan="2" style="text-align:center; color:#ef4444; padding-top:30px;">Error al conectar con la hoja. Verifica el ID y el acceso público.</td></tr>`;
      };

      document.body.appendChild(script);
    }

    function actualizarReloj() {
      const ahora = new Date();
      document.getElementById("reloj").textContent = ahora.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    // Ejecución inicial y temporizadores
    pedirDatos();
    actualizarReloj();
    setInterval(pedirDatos, 10000); // Actualiza cada 10 segundos
    setInterval(actualizarReloj, 1000);
</script>

</body>
</html>
