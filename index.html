<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Estado de Vehículos - Taller</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      padding: 24px 32px;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #334155;
      padding-bottom: 12px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2.2rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #38bdf8;
    }

    .clock {
      font-size: 2rem;
      font-weight: 700;
      color: #94a3b8;
    }

    /* Contenedor base de la cuadrícula */
    #grid-vehiculos {
      display: grid;
      width: 100%;
      align-content: start;
      transition: all 0.3s ease;
    }

    /* Modo 1 columna (1 a 5 autos): centrado y amplio */
    .cols-1 {
      grid-template-columns: 1fr;
      max-width: 900px;
      margin: 0 auto;
      gap: 16px;
    }

    /* Modo 2 columnas (6 a 10 autos): aprovecha todo el ancho de la TV */
    .cols-2 {
      grid-template-columns: repeat(2, 1fr);
      gap: 14px 24px;
      max-width: 100%;
    }

    /* Tarjetas de autos (dimensiones fijas sin reducción) */
    .card-auto {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modelo-texto {
      font-size: 1.6rem;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 60%;
    }

    /* Badges de estado */
    .badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 6px;
      font-size: 1.3rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .st-recibido { background-color: #3b82f6; color: #ffffff; }
    .st-diagnosticando { background-color: #eab308; color: #000000; }
    .st-repuestos { background-color: #f97316; color: #ffffff; }
    .st-proceso { background-color: #a855f7; color: #ffffff; }
    .st-listo { background-color: #22c55e; color: #ffffff; }
    .st-default { background-color: #475569; color: #ffffff; }

    .mensaje-vacio {
      text-align: center;
      color: #64748b;
      font-size: 1.6rem;
      padding-top: 60px;
      width: 100%;
    }
  </style>
</head>
<body>

  <header>
    <h1>Vehículos en Taller</h1>
    <div class="clock" id="reloj">--:--</div>
  </header>

  <div id="grid-vehiculos" class="cols-1">
    <div class="mensaje-vacio">Cargando datos...</div>
  </div>

  <script>
    // Inserte el ID de la hoja de Google Sheets
    const SHEET_ID = "1NAg-WiqwDBxwEo3wM0Uy3PquaBQGh-hNwWCBmBARvaw";
    const GID = "0";

    function getBadgeClass(estado) {
      const e = (estado || "").toLowerCase().trim();
      if (e.includes("recibido")) return "st-recibido";
      if (e.includes("diagnost")) return "st-diagnosticando";
      if (e.includes("repuesto")) return "st-repuestos";
      if (e.includes("proceso")) return "st-proceso";
      if (e.includes("listo")) return "st-listo";
      return "st-default";
    }

    window.renderDatosGoogle = function(json) {
      const container = document.getElementById("grid-vehiculos");
      try {
        if (!json || !json.table || !json.table.rows) {
          container.className = "cols-1";
          container.innerHTML = `<div class="mensaje-vacio">No se encontraron datos</div>`;
          return;
        }

        const rows = json.table.rows;

        // Filtrado de filas vacías y encabezados residuales
        const autos = rows.filter(r => {
          if (!r.c || !r.c[0] || r.c[0].v === null) return false;
          const txt = String(r.c[0].v).trim().toLowerCase();
          return txt !== "modelo" && txt !== "";
        });

        if (autos.length === 0) {
          container.className = "cols-1";
          container.innerHTML = `<div class="mensaje-vacio">No hay vehículos en taller</div>`;
          return;
        }

        // Lógica de conmutación: 1 a 5 autos = 1 columna; 6 o más = 2 columnas
        if (autos.length <= 5) {
          container.className = "cols-1";
        } else {
          container.className = "cols-2";
        }

        container.innerHTML = autos.map(r => {
          const modelo = (r.c[0] && r.c[0].v !== null) ? (r.c[0].f || r.c[0].v) : "—";
          const estado = (r.c[1] && r.c[1].v !== null) ? (r.c[1].f || r.c[1].v) : "Sin estado";
          const badgeClass = getBadgeClass(estado);

          return `
            <div class="card-auto">
              <span class="modelo-texto" title="${modelo}">${modelo}</span>
              <span class="badge ${badgeClass}">${estado}</span>
            </div>
          `;
        }).join("");

      } catch (err) {
        console.error("Error al renderizar:", err);
      }
    };

    function pedirDatos() {
      const viejo = document.getElementById("gviz-script");
      if (viejo) viejo.remove();

      const script = document.createElement("script");
      script.id = "gviz-script";
      script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:renderDatosGoogle&gid=${GID}&_nocache=${Date.now()}`;
      document.body.appendChild(script);
    }

    function actualizarReloj() {
      const ahora = new Date();
      document.getElementById("reloj").textContent = ahora.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    pedirDatos();
    actualizarReloj();
    setInterval(pedirDatos, 10000);
    setInterval(actualizarReloj, 1000);
  </script>
</body>
</html>
