<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Estado de Vehículos - Taller</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    
    body { 
      background-color: #0f172a; 
      color: #f8fafc; 
      padding: 16px 24px; 
      height: 100vh; 
      overflow: hidden; 
      display: flex; 
      flex-direction: column; 
    }
    
    header { 
      display: flex; justify-content: space-between; align-items: center; 
      border-bottom: 2px solid #334155; padding-bottom: 8px; margin-bottom: 16px; flex-shrink: 0;
    }
    h1 { font-size: 1.8rem; text-transform: uppercase; letter-spacing: 2px; color: #38bdf8; }
    .clock { font-size: 1.6rem; font-weight: 700; color: #94a3b8; }

    #grid-vehiculos { 
      display: grid; width: 100%; align-content: start; 
      flex-grow: 1; overflow-y: auto; scroll-behavior: smooth;
      scrollbar-width: none; 
    }
    #grid-vehiculos::-webkit-scrollbar { display: none; }

    .card-auto {
      background-color: #1e293b; border: 1px solid #334155; border-radius: 8px;
      display: flex; flex-direction: column; justify-content: center;
    }
    .card-header { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 8px; }
    .modelo-texto { font-weight: 700; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60%; }
    .badge { display: inline-block; border-radius: 6px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }
    
    /* 1 a 5 autos */
    .cols-1 { grid-template-columns: 1fr; max-width: 900px; margin: 0 auto; gap: 16px; padding-bottom: 20px;}
    .cols-1 .card-auto { padding: 18px 24px; }
    .cols-1 .modelo-texto { font-size: 1.8rem; }
    .cols-1 .badge { font-size: 1.4rem; padding: 8px 18px; }

    /* 6 autos en adelante */
    .cols-2 { grid-template-columns: repeat(2, 1fr); gap: 16px 24px; padding-bottom: 20px;}
    .cols-2 .card-auto { padding: 14px 20px; }
    .cols-2 .modelo-texto { font-size: 1.5rem; }
    .cols-2 .badge { font-size: 1.2rem; padding: 6px 14px; }

    .st-recibido { background-color: #3b82f6; color: #ffffff; }
    .st-diagnosticando { background-color: #eab308; color: #000000; }
    .st-repuestos { background-color: #f97316; color: #ffffff; }
    .st-proceso { background-color: #a855f7; color: #ffffff; }
    .st-listo { background-color: #22c55e; color: #ffffff; }
    .st-default { background-color: #475569; color: #ffffff; }

    .progress-container { width: 100%; height: 6px; background-color: #0f172a; border-radius: 3px; overflow: hidden; margin-top: 4px; }
    .progress-bar { height: 100%; background-color: #38bdf8; border-radius: 3px; transition: width 0.8s ease; }
    .mensaje-vacio { grid-column: 1 / -1; text-align: center; color: #64748b; font-size: 1.6rem; padding-top: 40px; }
  </style>
</head>
<body>

  <header>
    <h1>Vehículos en Taller</h1>
    <div class="clock" id="reloj">--:--</div>
  </header>

  <div id="grid-vehiculos" class="cols-1">
    <div class="mensaje-vacio">Cargando datos...</div>
  </div>

  <script>
    const SHEET_ID = "1NAg-WiqwDBxwEo3wM0Uy3PquaBQGh-hNwWCBmBARvaw";
    const GID = "0";

    let autoScrollInterval = null;
    let scrollDirection = 1;

    function getBadgeClass(estado) {
      const e = (estado || "").toLowerCase().trim();
      if (e.includes("recibido")) return "st-recibido";
      if (e.includes("diagnost")) return "st-diagnosticando";
      if (e.includes("repuesto")) return "st-repuestos";
      if (e.includes("proceso")) return "st-proceso";
      if (e.includes("listo")) return "st-listo";
      return "st-default";
    }

    window.renderDatosGoogle = function(json) {
      const container = document.getElementById("grid-vehiculos");
      try {
        if (!json || !json.table || !json.table.rows) {
          container.className = "cols-1";
          container.innerHTML = `<div class="mensaje-vacio">No se encontraron datos</div>`;
          return;
        }

        const autos = json.table.rows.filter(r => {
          if (!r.c || !r.c[0] || r.c[0].v === null) return false;
          const txt = String(r.c[0].v).trim().toLowerCase();
          return txt !== "modelo" && txt !== "";
        });

        if (autos.length === 0) {
          container.className = "cols-1";
          container.innerHTML = `<div class="mensaje-vacio">No hay vehículos en taller</div>`;
          return;
        }

        if (autos.length <= 5) {
          container.className = "cols-1";
        } else {
          container.className = "cols-2";
        }

        container.innerHTML = autos.map(r => {
          const modelo = (r.c[0] && r.c[0].v !== null) ? (r.c[0].f || r.c[0].v) : "—";
          const estado = (r.c[1] && r.c[1].v !== null) ? (r.c[1].f || r.c[1].v) : "Sin estado";
          let progreso = (r.c[2] && r.c[2].v !== null) ? Number(r.c[2].v) : 0;
          if (progreso > 100) progreso = 100;
          
          return `
            <div class="card-auto">
              <div class="card-header">
                <span class="modelo-texto" title="${modelo}">${modelo}</span>
                <span class="badge ${getBadgeClass(estado)}">${estado}</span>
              </div>
              <div class="progress-container">
                <div class="progress-bar" style="width: ${progreso}%"></div>
              </div>
            </div>
          `;
        }).join("");

        iniciarAutoScroll();

      } catch (err) {
        console.error("Error al renderizar:", err);
      }
    };

    function iniciarAutoScroll() {
      const grid = document.getElementById("grid-vehiculos");
      if (autoScrollInterval) clearInterval(autoScrollInterval);
      
      setTimeout(() => {
        if (grid.scrollHeight > grid.clientHeight + 5) {
          autoScrollInterval = setInterval(() => {
            if (scrollDirection === 1 && grid.scrollTop + grid.clientHeight >= grid.scrollHeight - 2) {
              scrollDirection = -1;
            } else if (scrollDirection === -1 && grid.scrollTop <= 0) {
              scrollDirection = 1;
            }
            grid.scrollTop += scrollDirection;
          }, 40);
        } else {
          grid.scrollTop = 0;
        }
      }, 300);
    }

    function pedirDatos() {
      const viejo = document.getElementById("gviz-script");
      if (viejo) viejo.remove();
      const script = document.createElement("script");
      script.id = "gviz-script";
      script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:renderDatosGoogle&gid=${GID}&_nocache=${Date.now()}`;
      document.body.appendChild(script);
    }

    function actualizarReloj() {
      const ahora = new Date();
      document.getElementById("reloj").textContent = ahora.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    pedirDatos();
    actualizarReloj();
    setInterval(pedirDatos, 10000);
    setInterval(actualizarReloj, 1000);
  </script>
</body>
</html>
